services:
  postgres:
    image: postgres:18-alpine
    container_name: kada-cs-postgres
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-kada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kada_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kada_cs}
    command:
      - "postgres"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/log/postgresql"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_HOST_DIR:-/Users/car/docker_data/postgreSQL_data}/data:/var/lib/postgresql
      - ${POSTGRES_HOST_DIR:-/Users/car/docker_data/postgreSQL_data}/logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kada} -d ${POSTGRES_DB:-kada_cs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-standalone:
    image: milvusdb/milvus:v2.4.15
    container_name: kada-cs-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - kada_milvus_data:/var/lib/milvus
      - ./docker/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./docker/milvus/user.yaml:/milvus/configs/user.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 60s
      timeout: 10s
      retries: 5

volumes:
  kada_milvus_data:
